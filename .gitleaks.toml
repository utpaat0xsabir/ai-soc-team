title = "AI SOC Team: SEC-01 verified noncredential exceptions"

[extend]
useDefault = true

# SEC-01: token-accounting policy identifier, not an authentication value.
# Exact file AND source line; Gitleaks may retain a leading newline in line context.
[[allowlists]]
description = "SEC-01: token-accounting policy identifier, not an authentication value."
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['^services/api/app/analysts/inference\.py$']
regexTarget = "line"
regexes = [
    '''^\n?    elif model\.token_accounting=='ESTIMATED_BYTES_PER4_V1' and model\.runtime_id=='ollama':$''', # SEC-01 line 220
]

# SEC-01: token-accounting policy identifier, not an authentication value.
# Exact file AND source line; Gitleaks may retain a leading newline in line context.
[[allowlists]]
description = "SEC-01: token-accounting policy identifier, not an authentication value."
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['^tests/analysts/test_analyst_inference\.py$']
regexTarget = "line"
regexes = [
    '''^\n?        token_accounting='SYNTHETIC_UTF8_BYTES_V1'\)$''', # SEC-01 line 25
]

# SEC-01: token-accounting policy identifier, not an authentication value.
# Exact file AND source line; Gitleaks may retain a leading newline in line context.
[[allowlists]]
description = "SEC-01: token-accounting policy identifier, not an authentication value."
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['^tests/analysts/test_ollama_inference\.py$']
regexTarget = "line"
regexes = [
    '''^\n?        'token_accounting':'ESTIMATED_BYTES_PER4_V1'\}\)$''', # SEC-01 line 24
]

# SEC-01: frozen HTTP/route SHA-256 expectations, not credentials.
